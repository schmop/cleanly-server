name: Cleanly Actions
run-name: ${{ gitea.actor }} is running ${{ gitea.workflow }} on ${{ gitea.repository }}
on: [push]

jobs:
  Check server build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: cleanly_test
          POSTGRES_USER: cleanly
          POSTGRES_PASSWORD: cleanly
        # No host port mapping — the runner host may already have Postgres on 5432.
        # Reach Postgres via the Gitea Actions service network using the `db` hostname.
        options: >-
          --health-cmd="pg_isready -U cleanly"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_SECRET: ci-test-secret
      JWT_PASSPHRASE: ci-test-passphrase
      DATABASE_URL: postgresql://cleanly:cleanly@db:5432/cleanly_test
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, pgsql, zip
          tools: phpstan, phpunit, composer:v2
      - name: Install dependencies
        run: composer install
      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction
      - name: Create test DB schema
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G src
      - name: Phpunit
        run: phpunit
      - name: Send mail on failure
        if: failure()
        uses: https://github.com/dawidd6/action-send-mail@v3
        with:
          connection_url: ${{ secrets.MAIL_CONNECTION }}
          to: ${{ secrets.MAIL_TO }}
          from: Gitea <gitea@schmoppo.de>
          subject: ${{ gitea.repository }} ${{gitea.workflow}} ${{ job.status }}
          priority: high
          convert_markdown: true
          html_body: |
            ### Job ${{ job.status }}

            ${{ github.repository }}: [${{ github.ref }}@${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/actions)